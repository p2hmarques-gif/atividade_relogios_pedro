<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Conecta o arquivo CSS para definir a aparência da página -->
    <link rel="stylesheet" href="styles.css">
    <title>Tabela de relógios</title>
</head>
<body>
    <main class="container">
        <!-- Título e identificação do aluno -->
        <h1>Lista de relógios</h1>
        <p class="aluno">PEDRO HENRIQUE MARQUES SILVA — RGM: 26110109</p>

        <!-- Tabela que receberá os dados do array de objetos -->
        <table>
            <thead>
                <th>Produto</th>
                <th>Categoria</th>
                <th>Quantidade</th>
                <th>Preço</th>
            </thead>
            <!-- O JavaScript colocará as linhas dos produtos neste espaço -->
            <tbody id="corpoTabela">
                <!-- Inserido pelo JS -->
            </tbody>
        </table>
    </main>

    <!-- Carrega o JavaScript, responsável por preencher a tabela -->
    <script src="main.js"></script>
</body>
</html>
